[project]
name = "auditbox"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.13.0",
    "fastapi>=0.165.0",
    "httpx>=0.28",
    "opencc-python-reimplemented>=0.1.7",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
    "pymupdf>=2.1",
    "pyyaml>=6.0.4",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "reportlab>=5.1.0",
]

[project.scripts]
auditbox = "auditbox.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
